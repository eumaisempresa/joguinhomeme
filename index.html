<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Crash - 67</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1117;
      font-family: system-ui, -apple-system, sans-serif;
      color: #e6edf3;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #ui {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 10px 12px;
      padding-top: max(10px, env(safe-area-inset-top));
      background: linear-gradient(to bottom, rgba(13,17,23,0.92), transparent);
      pointer-events: none;
    }
    h1 {
      font-size: 1.15rem;
      color: #3fb950;
      margin-bottom: 4px;
    }
    #info {
      font-size: 0.95rem;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #161b22;
    }
    #instrucoes {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 10px 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(13,17,23,0.9), transparent);
      font-size: 0.8rem;
      color: #8b949e;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Crash</h1>
    <div id="info">
      <span>Pontos: <strong id="pontos">0</strong></span>
      <span>Fase: <strong id="fase">1</strong></span>
      <span>Esmagados: <strong id="qtd">0</strong></span>
    </div>
  </div>

  <canvas id="game"></canvas>

  <div id="instrucoes">
    Toque na tela para colocar seus personagens<br>
    Chegue a <strong>67</strong> → explosão + próxima fase
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // ===== Responsivo =====
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 100));

    // ===== Estado =====
    let pontos = 0;
    let fase = 1;
    let pausado = false;

    const quadrado = {
      x: 0, y: 0, size: 36,
      velX: 3.2, velY: 2.7,
      cor: '#3fb950'
    };

    const personagens = [];
    const obstaculos = [];
    const particulas = [];
    const fogos = [];

    let celebracao = {
      ativo: false,
      vida: 0,
      maxVida: 320,
      escala: 0.1,
      dança: 0
    };

    // ===== Áudio estilo Coffin Dance =====
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function nota(freq, inicio, dur, tipo = 'square', vol = 0.09) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = tipo;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, audioCtx.currentTime + inicio);
      gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + inicio + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + inicio + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + inicio);
      osc.stop(audioCtx.currentTime + inicio + dur + 0.05);
    }

    function tocarMusiquinhaEnterro() {
      // Melodia inspirada no tema do Coffin Dance (Astronomia)
      const melodia = [
        [392, 0.00, 0.18], // G4
        [440, 0.18, 0.18], // A4
        [494, 0.36, 0.18], // B4
        [523, 0.54, 0.28], // C5
        [494, 0.90, 0.18],
        [440, 1.08, 0.18],
        [392, 1.26, 0.35],
        [349, 1.70, 0.25], // F4
        [392, 2.00, 0.40],
      ];

      melodia.forEach(([f, t, d]) => {
        nota(f, t, d, 'square', 0.11);
        nota(f/2, t, d, 'triangle', 0.05); // harmônico grave
      });

      // Batida de fundo
      for (let i = 0; i < 8; i++) {
        setTimeout(() => {
          nota(80, 0, 0.12, 'sawtooth', 0.07);
        }, i * 280);
      }
    }

    // ===== Toque / Clique =====
    function adicionarPersonagem(x, y) {
      if (pausado) return;
      personagens.push({
        x, y,
        size: 40,
        tipo: Math.random() < 0.5 ? 'lula' : 'bolsonaro',
        vivo: true,
        scale: 0.15
      });
    }

    canvas.addEventListener('click', e => {
      const rect = canvas.getBoundingClientRect();
      adicionarPersonagem(e.clientX - rect.left, e.clientY - rect.top);
    });

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const t = e.touches[0];
      adicionarPersonagem(t.clientX - rect.left, t.clientY - rect.top);
    }, { passive: false });

    function colide(a, b) {
      return a.x < b.x + b.size && a.x + a.size > b.x &&
             a.y < b.y + b.size && a.y + a.size > b.y;
    }

    function criarParticulas(x, y, cor) {
      for (let i = 0; i < 9; i++) {
        particulas.push({
          x, y,
          velX: (Math.random() - 0.5) * 7,
          velY: (Math.random() - 0.5) * 7,
          vida: 28 + Math.random() * 18,
          cor, size: 2.5 + Math.random() * 3.5
        });
      }
    }

    function criarFogos() {
      const cores = ['#ff0044','#00ff88','#0088ff','#ffff00','#ff00ff','#00ffff','#ffffff','#ff8800'];
      for (let b = 0; b < 9; b++) {
        const cx = canvas.width * 0.15 + Math.random() * canvas.width * 0.7;
        const cy = canvas.height * 0.15 + Math.random() * canvas.height * 0.5;
        for (let i = 0; i < 36; i++) {
          const ang = (Math.PI * 2 * i) / 36 + Math.random() * 0.3;
          const vel = 2.2 + Math.random() * 5;
          fogos.push({
            x: cx, y: cy,
            velX: Math.cos(ang) * vel,
            velY: Math.sin(ang) * vel,
            vida: 45 + Math.random() * 35,
            cor: cores[Math.floor(Math.random() * cores.length)],
            size: 2.2 + Math.random() * 3.2,
            grav: 0.045
          });
        }
      }
    }

    function gerarObstaculos() {
      obstaculos.length = 0;
      const qtd = Math.min(1 + fase, 7);
      for (let i = 0; i < qtd; i++) {
        obstaculos.push({
          x: 30 + Math.random() * (canvas.width - 120),
          y: 80 + Math.random() * (canvas.height - 180),
          w: 45 + Math.random() * 60,
          h: 16 + Math.random() * 22,
          cor: `hsl(${25 + Math.random()*50}, 70%, 42%)`
        });
      }
    }

    function iniciarCelebracao() {
      pausado = true;
      celebracao.ativo = true;
      celebracao.vida = celebracao.maxVida;
      celebracao.escala = 0.1;
      celebracao.dança = 0;
      criarFogos();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      tocarMusiquinhaEnterro();
    }

    function finalizarCelebracao() {
      pausado = false;
      celebracao.ativo = false;
      fase++;
      pontos = 0;
      personagens.length = 0;
      gerarObstaculos();
      // Reposiciona o quadrado
      quadrado.x = canvas.width / 2 - quadrado.size / 2;
      quadrado.y = canvas.height / 2 - quadrado.size / 2;
    }

    // ===== Desenhos =====
    function desenharOculos(x, y, size) {
      const gw = size * 0.55;
      const gh = size * 0.17;
      ctx.fillStyle = '#111';
      ctx.fillRect(x - gw/2, y - size*0.11, gw, gh);
      ctx.fillStyle = '#fff';
      ctx.fillRect(x - gw/2 + 3, y - size*0.11 + 2, 5, 3);
      ctx.fillRect(x + 3, y - size*0.11 + 2, 5, 3);
      ctx.fillRect(x - 3, y - size*0.07, 6, 2);
    }

    function desenharLula(x, y, size, scale, dancar = false) {
      ctx.save();
      ctx.translate(x, y + (dancar ? Math.sin(celebracao.dança) * 14 : 0));
      ctx.scale(scale, scale);

      ctx.beginPath();
      ctx.arc(0, 0, size/2, 0, Math.PI*2);
      ctx.fillStyle = '#f5c6a5';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, -size*0.14, size*0.47, Math.PI, 0);
      ctx.fillStyle = '#e8e8e8';
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(0, size*0.2, size*0.3, size*0.26, 0, 0, Math.PI*2);
      ctx.fillStyle = '#d0d0d0';
      ctx.fill();

      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(-size*0.15, -size*0.04, size*0.065, 0, Math.PI*2);
      ctx.arc( size*0.15, -size*0.04, size*0.065, 0, Math.PI*2);
      ctx.fill();

      if (dancar) desenharOculos(0, 0, size);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('LULA', 0, size/2 + 15);
      ctx.restore();
    }

    function desenharBolsonaro(x, y, size, scale, dancar = false) {
      ctx.save();
      ctx.translate(x, y + (dancar ? Math.sin(celebracao.dança + 1.3) * 14 : 0));
      ctx.scale(scale, scale);

      ctx.beginPath();
      ctx.arc(0, 0, size/2, 0, Math.PI*2);
      ctx.fillStyle = '#f0c4a0';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, -size*0.16, size*0.45, Math.PI, 0);
      ctx.fillStyle = '#3a2a1a';
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(0, size*0.11, size*0.26, size*0.09, 0, 0, Math.PI*2);
      ctx.fillStyle = '#3a2a1a';
      ctx.fill();

      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(-size*0.15, -size*0.04, size*0.065, 0, Math.PI*2);
      ctx.arc( size*0.15, -size*0.04, size*0.065, 0, Math.PI*2);
      ctx.fill();

      if (dancar) desenharOculos(0, 0, size);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('BOLSONARO', 0, size/2 + 15);
      ctx.restore();
    }

    // ===== Loop =====
    function update() {
      ctx.fillStyle = '#161b22';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Obstáculos
      obstaculos.forEach(o => {
        ctx.fillStyle = o.cor;
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.strokeRect(o.x, o.y, o.w, o.h);
      });

      // Personagens
      for (let i = personagens.length - 1; i >= 0; i--) {
        const p = personagens[i];
        if (!p.vivo) continue;
        if (p.scale < 1) p.scale += 0.08;

        if (p.tipo === 'lula') desenharLula(p.x, p.y, p.size, p.scale);
        else desenharBolsonaro(p.x, p.y, p.size, p.scale);

        if (!pausado && colide(quadrado, {
          x: p.x - p.size/2, y: p.y - p.size/2, size: p.size
        })) {
          p.vivo = false;
          pontos++;
          criarParticulas(p.x, p.y, p.tipo === 'lula' ? '#58a6ff' : '#f85149');
          if (pontos >= 67) iniciarCelebracao();
        }
      }
      for (let i = personagens.length - 1; i >= 0; i--) {
        if (!personagens[i].vivo) personagens.splice(i, 1);
      }

      // Partículas
      for (let i = particulas.length - 1; i >= 0; i--) {
        const pt = particulas[i];
        pt.x += pt.velX; pt.y += pt.velY; pt.velY += 0.15; pt.vida--;
        ctx.globalAlpha = Math.max(0, pt.vida / 38);
        ctx.fillStyle = pt.cor;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
        if (pt.vida <= 0) particulas.splice(i, 1);
      }

      // Fogos
      for (let i = fogos.length - 1; i >= 0; i--) {
        const f = fogos[i];
        f.x += f.velX; f.y += f.velY; f.velY += f.grav; f.velX *= 0.985; f.vida--;
        ctx.globalAlpha = Math.max(0, f.vida / 65);
        ctx.fillStyle = f.cor;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.size, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.size*0.35, 0, Math.PI*2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.globalAlpha = 1;
        if (f.vida <= 0) fogos.splice(i, 1);
      }

      // ===== Celebração =====
      if (celebracao.ativo) {
        celebracao.vida--;
        celebracao.dança += 0.2;

        if (celebracao.vida > celebracao.maxVida - 50) {
          celebracao.escala += 0.045;
        } else if (celebracao.vida < 60) {
          celebracao.escala *= 0.97;
        }

        const alpha = Math.min(1, celebracao.vida / 55);

        // Escurece o fundo
        ctx.fillStyle = `rgba(0,0,0,${0.55 * alpha})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Texto central
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(canvas.width / 2, canvas.height / 2 - 10);
        ctx.scale(celebracao.escala, celebracao.escala);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // SIX (em cima)
        ctx.shadowColor = '#ff00aa';
        ctx.shadowBlur = 22;
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 42px system-ui';
        ctx.fillText('SIX', 0, -70);

        // 67 (centro - bem grande)
        ctx.font = 'bold 92px system-ui';
        ctx.fillStyle = '#00ffcc';
        ctx.shadowColor = '#00ffaa';
        ctx.shadowBlur = 28;
        ctx.fillText('67', 0, 0);

        // SEVEN (embaixo)
        ctx.font = 'bold 42px system-ui';
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#ff00aa';
        ctx.shadowBlur = 22;
        ctx.fillText('SEVEN', 0, 75);

        ctx.restore();

        // Bonequinhos dançando
        const s = Math.min(1.3, canvas.width / 280);
        desenharLula(canvas.width * 0.18, canvas.height / 2 + 40, 44, s, true);
        desenharBolsonaro(canvas.width * 0.82, canvas.height / 2 + 40, 44, s, true);

        if (celebracao.vida <= 0) finalizarCelebracao();
      }

      // Move o quadrado
      if (!pausado) {
        // Inicializa posição se necessário
        if (quadrado.x === 0 && quadrado.y === 0) {
          quadrado.x = canvas.width / 2 - 18;
          quadrado.y = canvas.height / 2 - 18;
        }

        quadrado.x += quadrado.velX;
        quadrado.y += quadrado.velY;

        if (quadrado.x <= 0 || quadrado.x + quadrado.size >= canvas.width) {
          quadrado.velX *= -1;
          quadrado.x = Math.max(0, Math.min(quadrado.x, canvas.width - quadrado.size));
        }
        if (quadrado.y <= 0 || quadrado.y + quadrado.size >= canvas.height) {
          quadrado.velY *= -1;
          quadrado.y = Math.max(0, Math.min(quadrado.y, canvas.height - quadrado.size));
        }

        // Colisão obstáculos
        obstaculos.forEach(o => {
          if (quadrado.x < o.x + o.w && quadrado.x + quadrado.size > o.x &&
              quadrado.y < o.y + o.h && quadrado.y + quadrado.size > o.y) {
            const cx = quadrado.x + quadrado.size/2;
            const cy = quadrado.y + quadrado.size/2;
            const ox = o.x + o.w/2;
            const oy = o.y + o.h/2;
            if (Math.abs(cx - ox) > Math.abs(cy - oy)) quadrado.velX *= -1;
            else quadrado.velY *= -1;
          }
        });
      }

      // Quadrado
      ctx.shadowColor = 'rgba(63,185,80,0.5)';
      ctx.shadowBlur = 12;
      ctx.fillStyle = quadrado.cor;
      ctx.fillRect(quadrado.x, quadrado.y, quadrado.size, quadrado.size);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#1a7f37';
      ctx.lineWidth = 3;
      ctx.strokeRect(quadrado.x+2, quadrado.y+2, quadrado.size-4, quadrado.size-4);

      // HUD
      document.getElementById('pontos').textContent = pontos;
      document.getElementById('fase').textContent = fase;
      document.getElementById('qtd').textContent = personagens.length;

      requestAnimationFrame(update);
    }

    // Inicia
    gerarObstaculos();
    quadrado.x = window.innerWidth / 2 - 18;
    quadrado.y = window.innerHeight / 2 - 18;
    update();
  </script>
</body>
</html>
